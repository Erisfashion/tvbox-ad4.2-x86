name: Build TVBox For Android 4.2 x86

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      # 关键步骤：清理 GitHub 运行环境中不兼容的高版本 SDK，防止老版 Gradle 报 NumberFormatException
      - name: Cleanup Incompatible Android SDK Components
        run: |
          echo "Cleaning up incompatible Android SDK components..."
          rm -rf "$ANDROID_SDK_ROOT/system-images"
          rm -rf "$ANDROID_SDK_ROOT/platforms/android-3"[1-9]*
          rm -rf "$ANDROID_SDK_ROOT/platforms/android-"[4-9]*
          rm -rf "$ANDROID_SDK_ROOT/build-tools/3"[1-9]*
          rm -rf "$ANDROID_SDK_ROOT/build-tools/"[4-9]*
          find "$ANDROID_SDK_ROOT" -name "package.xml" -type f | while read -r xml_file; do
            if grep -q -E "extension-level|base-extension|34x|35x|3[6-9]\.|[4-9][0-9]\." "$xml_file" 2>/dev/null; then
              target_dir=$(dirname "$xml_file")
              echo "Removing incompatible component: $target_dir"
              rm -rf "$target_dir"
            fi
          done

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Android4.2-x86
          path: app/build/outputs/apk/**/*.apk
