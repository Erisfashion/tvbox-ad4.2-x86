// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        agp_version = '7.3'
        agp_version1 = '4.2.2'
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://jitpack.io" }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2' }
        maven { url 'http://download.01.org/crosswalk/releases/crosswalk/android/maven2'; allowInsecureProtocol = true }
        maven { url 'http://home.jundie.top:81/xwalk/maven2'; allowInsecureProtocol = true }
        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version1"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://jitpack.io" }
        maven { url 'https://maven.aliyun.com/repository/public' }
        // 关键：Crosswalk 官方源与镜像站（提供 xwalk_shared_library:23.53.589.4）
        maven { url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2' }
        maven { url 'http://download.01.org/crosswalk/releases/crosswalk/android/maven2'; allowInsecureProtocol = true }
        maven { url 'http://home.jundie.top:81/xwalk/maven2'; allowInsecureProtocol = true }
        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
